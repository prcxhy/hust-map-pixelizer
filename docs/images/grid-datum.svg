<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="780" height="420" fill="#fbfbf8"/>
  <text x="24" y="36" font-size="18" font-weight="600" fill="#1f2d3d">全局基准网格（GRID_DATUM 锚定）</text>

  <!-- 世界几何：地图真实要素，不随网格旋转 -->
  <rect x="40" y="60" width="330" height="150" fill="#cfe8cf" stroke="#b5d6b5"/>
  <text x="60" y="86" font-size="12" fill="#6a8a6a">底图（草地 / 道路）→ 截图子像素聚合取色</text>
  <path d="M 460 240 L 660 228 L 726 330 L 540 356 Z" fill="#f3e3d3" stroke="#d9b99b"/>
  <text x="560" y="292" font-size="12" fill="#8a6a58">建筑矢量要素</text>
  <text x="560" y="308" font-size="12" fill="#8a6a58">→ 渲染器纯色</text>
  <path d="M 60 330 L 420 300 L 430 340 L 70 372 Z" fill="#f2f1ef" stroke="#dddddd"/>

  <!-- 旋转网格组：锚定基准点、绕其旋转 θ -->
  <g transform="translate(320,210) rotate(-9)">
    <!-- 命中建筑的采样格 -->
    <rect x="96" y="48" width="48" height="48" fill="#f3e3d3" stroke="#e0b48c"/>
    <rect x="144" y="48" width="48" height="48" fill="#f3e3d3" stroke="#e0b48c"/>
    <rect x="144" y="96" width="48" height="48" fill="#f3e3d3" stroke="#e0b48c"/>
    <rect x="96" y="96" width="48" height="48" fill="#f3e3d3" stroke="#e0b48c"/>
    <!-- 命中草地的采样格 -->
    <rect x="-96" y="-96" width="48" height="48" fill="#cfe8cf" stroke="#9cc99c"/>
    <rect x="-48" y="-96" width="48" height="48" fill="#cfe8cf" stroke="#9cc99c"/>
    <rect x="-48" y="-48" width="48" height="48" fill="#cfe8cf" stroke="#9cc99c"/>
    <rect x="0" y="-48" width="48" height="48" fill="#cfe8cf" stroke="#9cc99c"/>
    <rect x="0" y="0" width="48" height="48" fill="#cfe8cf" stroke="#9cc99c"/>
    <rect x="-48" y="0" width="48" height="48" fill="#cfe8cf" stroke="#9cc99c"/>
    <!-- 网格线 -->
    <g stroke="#c96f6f" stroke-width="1.1" fill="none" opacity="0.85">
      <path d="M -144 -144 H 288 M -144 -96 H 288 M -144 -48 H 288 M -144 0 H 288 M -144 48 H 288 M -144 96 H 288 M -144 144 H 288"/>
      <path d="M -144 -144 V 144 M -96 -144 V 144 M -48 -144 V 144 M 0 -144 V 144 M 48 -144 V 144 M 96 -144 V 144 M 144 -144 V 144 M 192 -144 V 144 M 240 -144 V 144"/>
    </g>
    <!-- 全局格坐标示例 -->
    <text x="-142" y="-150" font-size="11" fill="#a05a5a">…, j-1</text>
    <text x="248" y="164" font-size="11" fill="#a05a5a">i+1, …</text>
  </g>

  <!-- 基准点 -->
  <circle cx="320" cy="210" r="6" fill="#d84c4c"/>
  <circle cx="320" cy="210" r="12" fill="none" stroke="#d84c4c" opacity="0.4"/>
  <text x="340" y="200" font-size="12" fill="#b03a3a" font-weight="600">GRID_DATUM 全局基准点</text>
  <text x="340" y="217" font-size="11" fill="#8a6a6a">格距 = 1/比例尺（按纬度换算投影米）</text>
  <text x="340" y="233" font-size="11" fill="#8a6a6a">旋转角 θ：网格绕基准点旋转</text>

  <!-- 框选窗口示意 -->
  <rect x="150" y="120" width="300" height="180" fill="none" stroke="#e74c3c" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="154" y="136" font-size="12" fill="#c0392b">框选窗口（仅决定收录哪些格）</text>

  <!-- 说明 -->
  <text x="24" y="398" font-size="12.5" fill="#555">格中心落在框内才收录；划分在世界坐标系下进行 → 建筑分块只受 比例尺 / 旋转角 / 基准点 影响，与拖框方式、缩放级别无关</text>
</svg>
